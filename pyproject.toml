[build-system]
# 77.0.1 is the first setuptools on PyPI that accepts `license` as an SPDX string (PEP 639):
# 76.1.0 rejects the string, and 77.0.0 is not on PyPI.
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-iotest"
dynamic = ["version"]
description = "A dead simple iotest for HPC environments"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "tee-logger>=6.34",
]
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
license = "GPL-3.0-or-later"

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
iotest = "iotest:climain"
simple-iotest = "iotest:climain"

[project.urls]
"Homepage" = "https://github.com/yufei-pan/simple-iotest"

[tool.setuptools]
py-modules = ["iotest"]

[tool.setuptools.dynamic]
version = {attr = "iotest.version"}

[tool.ruff]
target-version = "py37"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
