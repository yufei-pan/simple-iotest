[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-iotest"
dynamic = ["version"]
description = "A dead simple iotest for HPC environments"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "tee-logger>=6.34",
]
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" }
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
license = {text = "GPL-3.0-or-later"}

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
iotest = "iotest:climain"
simple-iotest = "iotest:climain"

[project.urls]
"Homepage" = "https://github.com/yufei-pan/simple-iotest"

[tool.setuptools]
py-modules = ["iotest"]

[tool.setuptools.dynamic]
version = {attr = "iotest.version"}

[tool.ruff]
target-version = "py37"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
